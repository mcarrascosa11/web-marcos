const main=document.querySelector('main'), featured=[{"slug": "rehabilitacion-vestuarios-sdr-arenas", "src": "proyectos/sdr-arenas/fdoarenas-6.webp", "alt": "Rehabilitación de vestuarios de la S.D.R. Arenas en Tudela", "title": "Rehabilitación de vestuarios S.D.R. Arenas", "place": "Tudela, Navarra"}, {"slug": "fp-tudela", "src": "img/FPTudela.webp", "alt": "Propuesta Edificio Formación Profesional Tudela", "title": "Propuesta nuevo edificio de formación profesional", "place": "Tudela, Navarra"}, {"slug": "rehabilitacion-cine-mapfre", "src": "img/proyecto1.webp", "alt": "Oficinas Mapfre en antiguo cine, Cabanillas", "title": "Rehabilitación de antiguo cine para oficinas para Mapfre", "place": "Cabanillas, Navarra"}, {"slug": "remodelacion-calle-misericordia", "src": "img/proyecto2.webp", "alt": "Remodelación urbana calles Misericordia y Trinquete, Tudela", "title": "Remodelación del espacio urbano de las calles de Misericordia, Alberto Pelairea y Trinquete", "place": "Tudela, Navarra"}, {"slug": "clinica-veterinaria-murchante", "src": "img/proyecto3.webp", "alt": "Diseño de clínica veterinaria en Murchante", "title": "Adecuación de local para clínica veterinaria", "place": "Murchante, Navarra"}, {"slug": "iglesia-san-nicolas", "src": "img/proyecto4.webp", "alt": "Restauración iglesia San Nicolás de Bari", "title": "Rehabilitación de San Nicolás de Bari", "place": "Tudela, Navarra"}];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let slide=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,filter='Todos',archiveView='visual',dual=false,gallery=[],photo=0;
const image=(src,alt,lazy=true)=>`<img src="${esc(src)}" alt="${esc(alt)}" ${lazy?'loading="lazy"':'fetchpriority="high"'} decoding="async">`;
const shortTitle=p=>p.slug==='rehabilitacion-vestuarios-sdr-arenas'?'Vestuarios S.D.R. Arenas':p.slug==='fp-tudela'?'Formación Profesional':p.slug==='iglesia-san-nicolas'?'San Nicolás de Bari':p.cardTitle;
function card(p){return `<a class="card" href="#proyecto/${p.slug}" data-category="${esc(p.category)}"><div class="card-media ${p.planImage?'has-plan':''}">${p.planImage?`<div class="plan-image">${image(p.planImage,'Plano de '+p.cardTitle)}</div><div class="hover-photo">${image(p.cardImage,p.cardAlt)}</div>`:image(p.cardImage,p.cardAlt)}</div><div class="card-caption"><h2>${esc(p.cardTitle)}</h2><div class="card-meta"><span>${esc(p.location)}</span><span>${esc(p.date)}</span></div></div></a>`}
function home(){document.body.classList.add('immersive');main.innerHTML=`<section class="home-stage" aria-label="Carrusel de proyectos seleccionados">${featured.map((p,i)=>`<a class="original-slide ${slide===i?'active':''}" href="#proyecto/${p.slug}" ${slide!==i?'tabindex="-1" aria-hidden="true"':''}>${image(p.src,p.alt,i!==0)}<div class="original-info"><h2>${esc(p.title)}</h2><p>${esc(p.place)}</p></div></a>`).join('')}<button class="original-prev" data-direction="-1" aria-label="Proyecto anterior">❮</button><button class="original-next" data-direction="1" aria-label="Proyecto siguiente">❯</button><div class="original-dots">${featured.map((_,i)=>`<button data-slide="${i}" aria-label="Ir al proyecto ${i+1}" aria-current="${i===slide}"></button>`).join('')}</div></section>`;main.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>{slide=+b.dataset.slide;showSlide();resetTimer()});main.querySelectorAll('[data-direction]').forEach(b=>b.onclick=()=>{advance(+b.dataset.direction);resetTimer()});resetTimer()}
function showSlide(){main.querySelectorAll('.original-slide').forEach((el,i)=>{el.classList.toggle('active',i===slide);el.tabIndex=i===slide?0:-1;el.setAttribute('aria-hidden',i!==slide)});main.querySelectorAll('[data-slide]').forEach((el,i)=>el.setAttribute('aria-current',i===slide))}
function advance(n){slide=(slide+n+featured.length)%featured.length;showSlide()}
let carouselTimer;
function resetTimer(){clearInterval(carouselTimer);carouselTimer=setInterval(()=>{if(playing&&!document.hidden&&(!location.hash||location.hash==='#inicio')&&!main.contains(document.activeElement))advance(1)},5000)}
const categories=[['Todos','Todos'],['rehabilitación','Rehabilitación'],['espacio urbano','Espacio urbano'],['local comercial','Local comercial'],['educacional','Educacional']];
function listing(){document.body.classList.remove('immersive');const selection=projects.filter(p=>filter==='Todos'||p.category===filter);main.innerHTML=`<section class="projects-page"><h1 class="sr-only">Proyectos</h1><div class="filters" role="group" aria-label="Filtrar proyectos por tipo">${categories.map(([value,label])=>`<button data-filter="${value}" aria-pressed="${filter===value}">${label}</button>`).join('')}<span class="project-count">${selection.length} proyectos</span></div><div class="grid">${selection.map(card).join('')}</div></section>`;main.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;listing()})}
function detail(p){document.body.classList.add('immersive');gallery=p.images;main.innerHTML=`<section class="detail-hero">${image(p.cardImage,p.cardAlt,false)}<h1>${esc(shortTitle(p))}</h1></section><section class="detail-info"><dl class="metadata">${p.meta.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl><div class="detail-intro"><h2>${esc(p.title)}</h2><div class="sub">${esc(p.location)} · ${esc(p.date)}</div><a class="back" href="#proyectos">← Todos los proyectos</a></div></section><div class="gallery">${p.images.map((im,i)=>`<div><button data-photo="${i}" aria-label="Ampliar imagen ${i+1}">${image(im.src,im.alt)}</button><p class="caption">${String(i+1).padStart(2,'0')} / ${String(p.images.length).padStart(2,'0')}</p></div>`).join('')}</div>`;main.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{photo=+b.dataset.photo;showPhoto();document.querySelector('dialog').showModal()});}
function render(){document.querySelector('header').classList.remove('scrolled');document.body.classList.remove('immersive','has-drawing');const path=location.hash.slice(1)||'inicio';document.querySelectorAll('nav a').forEach(a=>{if(path===a.hash.slice(1)||(path.startsWith('proyecto/')&&a.hash==='#proyectos'))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(path==='proyectos')listing();else if(path.startsWith('proyecto/')){const p=projects.find(p=>p.slug===path.split('/')[1]);p?detail(p):listing()}else if(path==='estudio')main.innerHTML=`<section class="about"><div>${image('img/SobreMi.webp','Marcos Carrascosa',false)}</div><div><p class="eyebrow">El estudio</p><h1>Arquitectura desde<br>el lugar.</h1><p>Soy Marcos Carrascosa, arquitecto formado en la Universidad de Zaragoza. Trabajo en proyectos de rehabilitación, vivienda y espacios públicos, atendiendo al contexto y a las personas que los habitan.</p><p>Tras colaborar con José Ignacio Zuazu en Tudela entre 2018 y 2023, establecí mi estudio en Zaragoza. Mi trabajo mantiene un vínculo con la Ribera de Navarra y con la recuperación del patrimonio.</p><a class="back" href="#contacto">Hablemos de tu proyecto ↗</a></div></section>`;else if(path==='contacto')main.innerHTML=`<section class="contact"><p class="eyebrow">Contacto</p><h1>Un lugar para empezar<br>tu próximo proyecto.</h1><div class="contact-grid"><div><p class="eyebrow">Escríbeme</p><a class="email" href="mailto:marcoscarrascosa.arq@gmail.com">marcoscarrascosa.arq@gmail.com ↗</a><p style="margin-top:25px"><a href="tel:+34699828171">+34 699 828 171</a></p></div><div><p class="eyebrow">El estudio</p><p>Calle Alfonso I, 17 · 2ª planta<br>50003 Zaragoza</p><p><a href="https://www.instagram.com/m_carrascosa/" target="_blank" rel="noopener">Instagram ↗</a></p></div></div></section>`;else home();window.scrollTo(0,0)}
function showPhoto(){const im=gallery[photo],el=document.querySelector('dialog img');el.src=im.src;el.alt=im.alt}
document.querySelector('.lb-close').onclick=()=>document.querySelector('dialog').close();document.querySelector('.lb-prev').onclick=()=>{photo=(photo-1+gallery.length)%gallery.length;showPhoto()};document.querySelector('.lb-next').onclick=()=>{photo=(photo+1)%gallery.length;showPhoto()};document.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;const n=e.key==='ArrowLeft'?-1:1;if(document.querySelector('dialog').open){photo=(photo+n+gallery.length)%gallery.length;showPhoto()}else if(!location.hash||location.hash==='#inicio')advance(n)});window.addEventListener('hashchange',render);window.addEventListener('scroll',()=>document.querySelector('header').classList.toggle('scrolled',window.scrollY>80&&!main.querySelector('.home-stage')),{passive:true});let touchStart=0;main.addEventListener('touchstart',e=>{touchStart=e.changedTouches[0].screenX},{passive:true});main.addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-touchStart;if((!location.hash||location.hash==='#inicio')&&Math.abs(d)>60)advance(d<0?1:-1)},{passive:true});render();
</script></body></html>
