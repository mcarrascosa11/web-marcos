const main=document.querySelector('main'), featured=projects.filter(p=>p.featured);

function home(){const p=featured[slide],detailImage=p.images.find(im=>im.src!==p.cardImage)||p.images[0];main.innerHTML=`<div class="home-top"><span class="eyebrow">OBRA SELECCIONADA / ${p.date.match(/\d{4}/)[0]}</span><span class="eyebrow">${String(slide+1).padStart(2,'0')} — ${String(featured.length).padStart(2,'0')}</span></div><div class="folio"><div class="folio-info"><span class="folio-number">[${String(slide+1).padStart(2,'0')}]</span><h1><a href="#proyecto/${p.slug}">${esc(p.cardTitle)}</a></h1><span class="sub">${esc(p.location)}<br>${esc(p.category)} / ${esc(p.date)}</span><a class="folio-link" href="#proyecto/${p.slug}">Explorar proyecto <span>↗</span></a></div><a class="hero" href="#proyecto/${p.slug}" aria-label="Ver ${esc(p.cardTitle)}">${image(p.cardImage,p.cardAlt,false)}</a><div class="folio-detail"><div class="vertical-note">LECTURAS DE UN LUGAR<br>────────────<br>Obra, materia<br>y transformación.</div><a href="#proyecto/${p.slug}" aria-label="Ver la galería de ${esc(p.cardTitle)}">${image(detailImage.src,detailImage.alt)}</a><p class="caption">OTRA MIRADA / ${p.images.length} IMÁGENES</p></div></div><div class="home-bottom"><a href="#proyectos">Índice de proyectos [10] ↗</a><div class="controls"><div class="progress">${featured.map((_,i)=>`<button class="${i===slide?'active':''}" data-slide="${i}" aria-label="Ir al proyecto ${i+1}" ${i===slide?'aria-current="true"':''}></button>`).join('')}</div><span class="counter">${String(slide+1).padStart(2,'0')} / ${String(featured.length).padStart(2,'0')}</span><button data-direction="-1" aria-label="Proyecto anterior">←</button><button data-direction="1" aria-label="Proyecto siguiente">→</button><button class="pause" aria-label="${playing?'Pausar':'Reanudar'} carrusel">${playing?'Pausar':'Reanudar'}</button></div></div>`;main.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>{slide=+b.dataset.slide;home()});main.querySelectorAll('[data-direction]').forEach(b=>b.onclick=()=>advance(+b.dataset.direction));main.querySelector('.pause').onclick=()=>{playing=!playing;home()};}

function listing(){const categories=['Todos','Rehabilitación','Educacional','Espacio urbano','Local comercial'];const list=projects.filter(p=>filter==='Todos'||p.category.toLowerCase()===filter.toLowerCase());main.innerHTML=`<div class="page-heading"><h1>Obra.</h1><span class="eyebrow">ÍNDICE DE PROYECTOS / 2021—2026<br>ORDEN CRONOLÓGICO ↓</span></div><div class="archive-bar"><div class="filters" aria-label="Filtrar proyectos">${categories.map(c=>`<button class="${filter===c?'selected':''}" aria-pressed="${filter===c}" data-filter="${c}">${c}</button>`).join('')}</div><div class="view-switch"><button data-view="visual" class="${archiveView==='visual'?'selected':''}" aria-pressed="${archiveView==='visual'}">Visual</button><button data-view="indice" class="${archiveView==='indice'?'selected':''}" aria-pressed="${archiveView==='indice'}">Índice</button></div></div><div class="${archiveView==='visual'?'grid':'archive-list'}">${list.map(p=>{const num=String(projects.indexOf(p)+1).padStart(2,'0');return archiveView==='visual'?`<a class="card" href="#proyecto/${p.slug}"><div class="card-top"><span>[${num}] / ${esc(p.category)}</span><span>↗</span></div>${image(p.cardImage,p.cardAlt)}<h2>${esc(p.cardTitle)}</h2><div class="card-meta"><span>${esc(p.location)}</span><span>${esc(p.date)}</span></div></a>`:`<a class="archive-row" href="#proyecto/${p.slug}"><span class="num">${num}</span><h2>${esc(p.cardTitle)}</h2><span class="place">${esc(p.location)}</span><span class="date">${esc(p.date)}</span><span>↗</span></a>`}).join('')}</div>`;main.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;listing()});main.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{archiveView=b.dataset.view;listing()});}
function detail(p){gallery=p.images;main.innerHTML=`<div class="detail-title"><a class="back" href="#proyectos">← Todos los proyectos</a><h1>${esc(p.title)}</h1></div><div class="detail"><dl class="metadata">${p.meta.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl><div class="gallery">${p.images.map((im,i)=>`<div><button data-photo="${i}" aria-label="Ampliar imagen ${i+1}">${image(im.src,im.alt,i!==0)}</button><p class="caption">${String(i+1).padStart(2,'0')} / ${String(p.images.length).padStart(2,'0')}</p></div>`).join('')}</div></div>`;main.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{photo=+b.dataset.photo;showPhoto();document.querySelector('dialog').showModal()});}

function showPhoto(){const im=gallery[photo],el=document.querySelector('dialog img');el.src=im.src;el.alt=im.alt}
document.querySelector('.lb-close').onclick=()=>document.querySelector('dialog').close();document.querySelector('.lb-prev').onclick=()=>{photo=(photo-1+gallery.length)%gallery.length;showPhoto()};document.querySelector('.lb-next').onclick=()=>{photo=(photo+1)%gallery.length;showPhoto()};document.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;const n=e.key==='ArrowLeft'?-1:1;if(document.querySelector('dialog').open){photo=(photo+n+gallery.length)%gallery.length;showPhoto()}else if(!location.hash||location.hash==='#inicio')advance(n)});setInterval(()=>{if(playing&&!document.hidden&&(!location.hash||location.hash==='#inicio')&&!main.matches(':hover')&&!main.contains(document.activeElement))advance(1)},6500);window.addEventListener('hashchange',render);render();
