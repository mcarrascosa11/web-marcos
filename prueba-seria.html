const main=document.querySelector('main'), featured=projects.filter(p=>p.featured);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let slide=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,filter='Todos',gallery=[],photo=0;
const image=(src,alt,lazy=true)=>`<img src="${esc(src)}" alt="${esc(alt)}" ${lazy?'loading="lazy"':'fetchpriority="high"'} decoding="async">`;
function home(){const p=featured[slide];main.innerHTML=`<div class="home-top"><span class="eyebrow">Arquitectura · Rehabilitación · Espacio público</span><span class="eyebrow">Selección de proyectos</span></div><a class="hero" href="#proyecto/${p.slug}" aria-label="Ver ${esc(p.cardTitle)}">${image(p.cardImage,p.cardAlt,false)}</a><div class="hero-bottom"><div><h1><a href="#proyecto/${p.slug}">${esc(p.cardTitle)} ↗</a></h1><span class="sub">${esc(p.location)} &nbsp;·&nbsp; ${esc(p.date)}</span></div><div class="controls"><div class="progress">${featured.map((_,i)=>`<button class="${i===slide?'active':''}" data-slide="${i}" aria-label="Ir al proyecto ${i+1}" ${i===slide?'aria-current="true"':''}></button>`).join('')}</div><span class="counter">${String(slide+1).padStart(2,'0')} / ${String(featured.length).padStart(2,'0')}</span><button data-direction="-1" aria-label="Proyecto anterior">←</button><button data-direction="1" aria-label="Proyecto siguiente">→</button><button class="pause" aria-label="${playing?'Pausar':'Reanudar'} carrusel">${playing?'Pausar':'Reanudar'}</button></div></div>`;main.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>{slide=+b.dataset.slide;home()});main.querySelectorAll('[data-direction]').forEach(b=>b.onclick=()=>advance(+b.dataset.direction));main.querySelector('.pause').onclick=()=>{playing=!playing;home()};}
function advance(n){slide=(slide+n+featured.length)%featured.length;home()}
function listing(){const categories=['Todos','Rehabilitación','Educacional','Espacio urbano','Local comercial'];const list=projects.filter(p=>filter==='Todos'||p.category.toLowerCase()===filter.toLowerCase());main.innerHTML=`<div class="page-heading"><h1>Proyectos</h1><span class="eyebrow">${projects.length} proyectos · 2021 — 2026</span></div><div class="filters" aria-label="Filtrar proyectos">${categories.map(c=>`<button class="${filter===c?'selected':''}" aria-pressed="${filter===c}" data-filter="${c}">${c}</button>`).join('')}</div><div class="grid">${list.map(p=>`<a class="card" href="#proyecto/${p.slug}">${image(p.cardImage,p.cardAlt)}<h2>${esc(p.cardTitle)}</h2><div class="card-meta"><span>${esc(p.location)}</span><span>${esc(p.date)}</span></div></a>`).join('')}</div>`;main.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;listing()});}
function detail(p){gallery=p.images;main.innerHTML=`<div class="detail-title"><a class="back" href="#proyectos">← Todos los proyectos</a><h1>${esc(p.title)}</h1></div><div class="detail"><dl class="metadata">${p.meta.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl><div class="gallery">${p.images.map((im,i)=>`<div><button data-photo="${i}" aria-label="Ampliar imagen ${i+1}">${image(im.src,im.alt,i!==0)}</button><p class="caption">${String(i+1).padStart(2,'0')} / ${String(p.images.length).padStart(2,'0')}</p></div>`).join('')}</div></div>`;main.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{photo=+b.dataset.photo;showPhoto();document.querySelector('dialog').showModal()});}
function render(){const path=location.hash.slice(1)||'inicio';document.querySelectorAll('nav a').forEach(a=>{if(path===a.hash.slice(1)||(path.startsWith('proyecto/')&&a.hash==='#proyectos'))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(path==='proyectos')listing();else if(path.startsWith('proyecto/')){const p=projects.find(p=>p.slug===path.split('/')[1]);p?detail(p):listing()}else if(path==='estudio')main.innerHTML=`<section class="about"><div>${image('img/SobreMi.webp','Marcos Carrascosa',false)}</div><div><p class="eyebrow">El estudio</p><h1>Arquitectura desde<br>el lugar.</h1><p>Soy Marcos Carrascosa, arquitecto formado en la Universidad de Zaragoza. Trabajo en proyectos de rehabilitación, vivienda y espacios públicos, atendiendo al contexto y a las personas que los habitan.</p><p>Tras colaborar con José Ignacio Zuazu en Tudela entre 2018 y 2023, establecí mi estudio en Zaragoza. Mi trabajo mantiene un vínculo con la Ribera de Navarra y con la recuperación del patrimonio.</p><a class="back" href="#contacto">Hablemos de tu proyecto ↗</a></div></section>`;else if(path==='contacto')main.innerHTML=`<section class="contact"><p class="eyebrow">Contacto</p><h1>Un lugar para empezar<br>tu próximo proyecto.</h1><div class="contact-grid"><div><p class="eyebrow">Escríbeme</p><a class="email" href="mailto:marcoscarrascosa.arq@gmail.com">marcoscarrascosa.arq@gmail.com ↗</a><p style="margin-top:25px"><a href="tel:+34699828171">+34 699 828 171</a></p></div><div><p class="eyebrow">El estudio</p><p>Calle Alfonso I, 17 · 2ª planta<br>50003 Zaragoza</p><p><a href="https://www.instagram.com/m_carrascosa/" target="_blank" rel="noopener">Instagram ↗</a></p></div></div></section>`;else home();window.scrollTo(0,0)}
function showPhoto(){const im=gallery[photo],el=document.querySelector('dialog img');el.src=im.src;el.alt=im.alt}
document.querySelector('.lb-close').onclick=()=>document.querySelector('dialog').close();document.querySelector('.lb-prev').onclick=()=>{photo=(photo-1+gallery.length)%gallery.length;showPhoto()};document.querySelector('.lb-next').onclick=()=>{photo=(photo+1)%gallery.length;showPhoto()};document.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;const n=e.key==='ArrowLeft'?-1:1;if(document.querySelector('dialog').open){photo=(photo+n+gallery.length)%gallery.length;showPhoto()}else if(!location.hash||location.hash==='#inicio')advance(n)});setInterval(()=>{if(playing&&!document.hidden&&(!location.hash||location.hash==='#inicio')&&!main.matches(':hover')&&!main.contains(document.activeElement))advance(1)},6500);window.addEventListener('hashchange',render);render();
</script></body></html>
