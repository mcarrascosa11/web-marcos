<!DOCTYPE html>
<html lang="es">
<head>
    <title>{{SEO_TITLE}}</title>
    {{HEAD_COMMON}}
    {{VERIFICATION}}
    <meta property="og:type" content="article">
    <link rel="preload" as="image" href="{{OG_IMAGE}}" fetchpriority="high">
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','{{GTM_ID}}');</script>
    <script type="application/ld+json">{{SCHEMA}}</script>
    <script type="application/ld+json">{{BREADCRUMB}}</script>
</head>
<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id={{GTM_ID}}" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    {{HEADER}}

    <main id="contenido">
        <div class="container" style="padding-bottom:0;">
            <h2 class="project-title">{{PROJECT_TITLE}}</h2>
        </div>

        <section class="container project-content-grid" aria-label="Información y galería del proyecto">
            <aside class="project-sidebar">
                <p class="project-description">{{DESCRIPTION}}</p>
{{METADATA}}
            </aside>
            <div class="project-images">{{IMAGES}}</div>
        </section>
    </main>

    {{FOOTER}}

    <div id="lightbox" class="lightbox" aria-hidden="true">
        <button class="close-lightbox" type="button" aria-label="Cerrar">&times;</button>
        <button class="prev-lightbox" type="button" aria-label="Imagen anterior">&#10094;</button>
        <img class="lightbox-content" id="lightbox-img" alt="">
        <button class="next-lightbox" type="button" aria-label="Imagen siguiente">&#10095;</button>
    </div>

    <button id="btn-subir" title="Ir arriba" aria-label="Ir arriba"><i class="fas fa-chevron-up"></i></button>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const images = [...document.querySelectorAll('.project-images img')];
        let currentIndex = 0;
        const show = index => {
            if (!images.length) return;
            currentIndex = (index + images.length) % images.length;
            lightboxImg.src = images[currentIndex].currentSrc || images[currentIndex].src;
            lightboxImg.alt = images[currentIndex].alt || '';
            lightbox.style.display = 'flex';
            lightbox.setAttribute('aria-hidden', 'false');
        };
        const close = () => { lightbox.style.display = 'none'; lightbox.setAttribute('aria-hidden', 'true'); };
        images.forEach((img, index) => img.addEventListener('click', () => show(index)));
        document.querySelector('.close-lightbox')?.addEventListener('click', close);
        document.querySelector('.prev-lightbox')?.addEventListener('click', () => show(currentIndex - 1));
        document.querySelector('.next-lightbox')?.addEventListener('click', () => show(currentIndex + 1));
        lightbox.addEventListener('click', e => { if (e.target === lightbox) close(); });
        document.addEventListener('keydown', e => {
            if (lightbox.getAttribute('aria-hidden') !== 'false') return;
            if (e.key === 'Escape') close();
            if (e.key === 'ArrowLeft') show(currentIndex - 1);
            if (e.key === 'ArrowRight') show(currentIndex + 1);
        });
        let touchStart = 0;
        lightbox.addEventListener('touchstart', e => { touchStart = e.changedTouches[0].screenX; }, { passive:true });
        lightbox.addEventListener('touchend', e => {
            const end = e.changedTouches[0].screenX;
            if (end < touchStart - 50) show(currentIndex + 1);
            if (end > touchStart + 50) show(currentIndex - 1);
        }, { passive:true });
        const btn = document.getElementById('btn-subir');
        window.addEventListener('scroll', () => { btn.style.display = window.scrollY > 300 ? 'block' : 'none'; }, { passive:true });
        btn.addEventListener('click', () => window.scrollTo({ top:0, behavior:'smooth' }));
    });
    </script>
</body>
</html>
